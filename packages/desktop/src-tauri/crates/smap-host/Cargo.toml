[package]
name = "smap-host"
version = "0.1.0"
edition = "2021"
publish = false
description = "Harita Tasarlayıcı masaüstü kabuğunun Tauri'den bağımsız çekirdeği: güvenli kayıt, yol kapsamı, dosya izleyici, son projeler, log."

[dependencies]
log = { version = "0.4", features = ["std"] }
notify = "8"
notify-debouncer-mini = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dunce = "1"
axum = { version = "=0.8.6", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros"] }
getrandom = "0.3"
subtle = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
