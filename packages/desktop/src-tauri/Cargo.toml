[package]
name = "harita-tasarlayici"
version = "0.6.1"
description = "Harita Tasarlayıcı — 2D tile harita editörü (Tauri kabuğu)"
edition = "2021"
publish = false

[lib]
# `_lib` soneki: Windows'ta bin ve lib aynı adı taşıyınca çıktı dosyaları çakışır.
name = "harita_tasarlayici_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
smap-host = { path = "crates/smap-host" }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(windows)'.dependencies]
# Must stay on the same webview2-com / windows-core versions wry uses (check Cargo.lock).
webview2-com = "0.39"
windows-core = "0.62"

[workspace]
members = [".", "crates/smap-host"]
resolver = "2"

# Startup speed: the exe's own code is a tiny fraction of start-up time
# (WebView2 init dominates); what we can control is how much has to be read
# from disk and scanned by Defender before the first frame. So: smallest
# binary — fat LTO, one codegen unit, opt-level "s", symbols stripped.
# panic stays "unwind" so a bug in one command cannot kill the process and
# lose unsaved work.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
incremental = false

[profile.dev]
incremental = true

# Dependencies optimized even in dev so `tauri dev` feels like the real thing.
[profile.dev.package."*"]
opt-level = 2
